<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тригонометрия: ЦЭ/ЦТ</title>
<style>
/* Layout: одна колонка, карточка вопроса по центру, таймер в шапке */
:root{--bg:#eef1f5;--card:#fff;--line:#d8dee6;--fg:#222;--muted:#667;--accent:#2f7bc0;--accent-h:#2a6cab;--head:#2f7bc0;--head-fg:#fff;--soft:#f8fafc;--sel:#e8f2fb;--hover:#f2f7fc;--ok-bg:#e4f6e5;--ok:#4caf50;--bad-bg:#fde7e7;--bad:#e05252;--sol:#f5f7fa;--sec:#e3e8ee;--sec-h:#d4dbe3;--sec-fg:#223;--inp:#b9c4d0;--track:#dde3ea;--row:#e0e5eb;--opt:#d0d8e2;--yes:#2e8b3a;--no:#d03a3a;--btn-fg:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#13181d;--card:#1b2229;--line:#2d3742;--fg:#e4e9ee;--muted:#9aa6b2;--accent:#4a9be0;--accent-h:#6bb0ee;--head:#1d3f5e;--head-fg:#fff;--soft:#202830;--sel:#1d3347;--hover:#232c35;--ok-bg:#16301b;--ok:#4caf50;--bad-bg:#3a1b1b;--bad:#e05a5a;--sol:#20282f;--sec:#2a343e;--sec-h:#34404c;--sec-fg:#e4e9ee;--inp:#3d4955;--track:#2a343e;--row:#2a343e;--opt:#34404c;--yes:#5cc46a;--no:#ef6b6b;--btn-fg:#0b1218;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13181d;--card:#1b2229;--line:#2d3742;--fg:#e4e9ee;--muted:#9aa6b2;--accent:#4a9be0;--accent-h:#6bb0ee;--head:#1d3f5e;--head-fg:#fff;--soft:#202830;--sel:#1d3347;--hover:#232c35;--ok-bg:#16301b;--ok:#4caf50;--bad-bg:#3a1b1b;--bad:#e05a5a;--sol:#20282f;--sec:#2a343e;--sec-h:#34404c;--sec-fg:#e4e9ee;--inp:#3d4955;--track:#2a343e;--row:#2a343e;--opt:#34404c;--yes:#5cc46a;--no:#ef6b6b;--btn-fg:#0b1218;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;font-size:17px}
header{background:var(--head);color:var(--head-fg);padding:14px max(16px,env(safe-area-inset-left,0px));font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header .timer{font-weight:bold;font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;max-width:1140px;margin:20px auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
main{min-width:0}
nav{align-self:start;position:sticky;top:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 8px;max-height:calc(100vh - 24px);overflow-y:auto}
nav h4{margin:12px 10px 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav h4:first-child{margin-top:2px}
nav a{display:flex;gap:8px;padding:8px 10px;border-radius:4px;color:var(--fg);text-decoration:none;font-size:15px;line-height:1.35}
nav a b{min-width:2.2em;color:var(--muted);font-weight:normal;font-variant-numeric:tabular-nums}
nav a:hover{background:var(--hover)}
nav a.cur{background:var(--sel);color:var(--accent);font-weight:bold}
nav a:focus-visible{outline:2px solid var(--accent)}
#menuBtn{display:none;background:var(--sec);color:var(--sec-fg);padding:8px 14px;font-size:16px}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}nav{position:static;display:none;max-height:none}nav.open{display:block}#menuBtn{display:inline-block}}
.box{margin:16px 0;padding:12px 16px;border-radius:5px;background:var(--sol);border-left:4px solid var(--accent);line-height:1.65;overflow-x:auto}
.box.def{border-left-color:var(--accent)}
.box.alg{border-left-color:var(--ok);background:var(--ok-bg)}
.box.ex{border-left-color:var(--muted)}
.box.fm{text-align:center;background:var(--sel)}
.box.alg ol,.box.alg ul{margin:6px 0 0;padding-left:22px}
.theory h2{font-size:24px;line-height:1.3}
.theory h3{font-size:19px;margin:26px 0 8px}
.theory p,.theory li{line-height:1.7}
.theory .props li{margin-bottom:6px}
.theory mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%}
.fig{margin:18px 0;text-align:center}
.figbox img{max-width:100%;height:auto;border-radius:4px;background:#fff}
.figph{display:flex;align-items:center;justify-content:center;min-height:160px;border:2px dashed var(--line);border-radius:6px;color:var(--muted);background:var(--soft)}
.fig figcaption{margin-top:6px;font-size:15px;color:var(--muted)}
.tbl th,.tbl td{text-align:center;padding:8px 10px;border:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}
.pager a{display:inline-block;padding:10px 16px;border-radius:4px;background:var(--sec);color:var(--sec-fg);text-decoration:none;font-size:16px}
.pager a:hover{background:var(--sec-h)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.grid2 a{display:block;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--fg);text-decoration:none;line-height:1.4}
.grid2 a:hover{border-color:var(--accent);background:var(--sel)}
.grid2 a span{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px;margin-bottom:16px;min-width:0}
h1,h2{margin:0 0 12px;text-wrap:balance}
h2{font-size:20px}
.tests{display:grid;gap:12px}
.test-item{border:1px solid var(--line);border-radius:6px;padding:14px;cursor:pointer;background:var(--soft)}
.test-item.sel{border-color:var(--accent);background:var(--sel)}
.test-item b{display:block;margin-bottom:4px}
.muted{color:var(--muted);font-size:15px}
label.row{display:block;margin:12px 0 4px}
input[type=text]{padding:9px 10px;font-size:17px;border:1px solid var(--inp);border-radius:4px;width:100%;max-width:300px;background:var(--card);color:var(--fg)}
button{background:var(--accent);color:var(--btn-fg);border:0;border-radius:4px;padding:11px 22px;font-size:17px;cursor:pointer}
button:hover{background:var(--accent-h)}
button.sec{background:var(--sec);color:var(--sec-fg)}
button.sec:hover{background:var(--sec-h)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.prog{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-bottom:14px}
.prog div{height:100%;background:var(--ok);transition:width .3s}
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:15px;margin-bottom:12px}
.qtext{font-size:19px;line-height:1.55;margin-bottom:16px;user-select:none;-webkit-user-select:none;overflow-x:auto}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--opt);border-radius:5px;margin-bottom:8px;cursor:pointer;user-select:none}
.opt:hover{background:var(--hover)}
.opt input{margin-top:5px;transform:scale(1.2)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.locked{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:5px}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.sol{margin-top:10px;padding:12px 14px;background:var(--sol);border-left:4px solid var(--accent);line-height:1.6;overflow-x:auto}
.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.score{font-size:30px;font-weight:bold;margin:6px 0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--row);padding:8px 6px;text-align:left;font-size:16px}
details{border-bottom:1px solid var(--row);padding:8px 0}
summary{cursor:pointer}
.yes{color:var(--yes);font-weight:bold}.no{color:var(--no);font-weight:bold}
.hidden{display:none}
.msg{margin-top:10px;color:var(--no)}
.plot{margin-top:12px}
.plot canvas{width:100%;max-width:100%;height:auto;border:1px solid var(--line);border-radius:5px;background:var(--card);display:block}
.plot a{display:inline-block;margin-top:6px;font-size:15px;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.prog div{transition:none}}
</style>

<body>
<header><span>Тригонометрия: подготовка к ЦТ/ЦЭ</span><span class="timer hidden" id="timer"></span><button id="menuBtn" type="button" aria-expanded="false">☰ Разделы</button></header>

<script>
/* ===================== ДАННЫЕ ТЕСТОВ ===================== */
/* t: 'num' (ввод числа), 'one' (один ответ), 'multi' (несколько ответов)
   a: число / индекс верного варианта (с 0) / массив индексов */
const R = String.raw;
const TESTS = {
eq: {
  title: "Тригонометрические уравнения",
  desc: "10 заданий: уравнения, отбор корней на промежутке, ответ — число.",
  qs: [
  {t:'num', a:160,
   q:R`Решите уравнение $\sqrt{3}\cos\left(\dfrac{5\pi}{18}+\pi x\right)=-1{,}5$. В ответ запишите увеличенное в 3 раза произведение наибольшего корня на количество корней этого уравнения на промежутке $[3;\,9]$.`,
   sol:R`$\cos\left(\frac{5\pi}{18}+\pi x\right)=-\frac{\sqrt3}{2}$, откуда $x=\frac59+2n$ или $x=-\frac{10}{9}+2n$, $n\in\mathbb Z$.<br>На $[3;9]$: первая серия даёт $n=2,3,4$, вторая — $n=3,4,5$. Всего 6 корней, наибольший $x=-\frac{10}{9}+10=8\frac89=\frac{80}{9}$.<br>$3\cdot 6\cdot\frac{80}{9}=160$.`},
  {t:'num', a:-62,
   q:R`Найдите (в градусах) наименьший корень уравнения $\cos 8x\cos 7x-\sin 8x\sin 7x=-\dfrac{\sqrt3}{2}$ на промежутке $(-75^\circ;\,0^\circ)$.`,
   sol:R`По формуле косинуса суммы $\cos 15x=-\frac{\sqrt3}{2}$, $15x=\pm150^\circ+360^\circ k$, то есть $x=10^\circ+24^\circ k$ или $x=-10^\circ+24^\circ k$ (серия $14^\circ+24^\circ k$ даёт те же значения).<br>В промежутке $(-75^\circ;0^\circ)$ наименьший корень равен $-62^\circ$.`},
  {t:'num', a:28,
   q:R`Найдите (в градусах) корень уравнения $4\cos(58^\circ-x)\cos(32^\circ+x)=\sqrt3$ на промежутке $(0^\circ;\,45^\circ)$.`,
   sol:R`$2\left(\cos 90^\circ+\cos(26^\circ-2x)\right)=\sqrt3$, $\cos(26^\circ-2x)=\frac{\sqrt3}{2}$.<br>$26^\circ-2x=\pm30^\circ+360^\circ k$: $x=-2^\circ-180^\circ k$ или $x=28^\circ-180^\circ k$.<br>В $(0^\circ;45^\circ)$ подходит только $x=28^\circ$.`},
  {t:'num', a:-165,
   q:R`Найдите (в градусах) наименьший корень уравнения $1-\sin 7x=\left(\cos\dfrac{5x}{2}-\sin\dfrac{5x}{2}\right)^2$ на промежутке $(-180^\circ;\,60^\circ]$.`,
   sol:R`Раскрываем квадрат: $1-\sin7x=1-\sin5x$, $\sin7x-\sin5x=0$, $2\sin x\cos 6x=0$.<br>$\sin x=0$: $x=180^\circ n$; $\cos6x=0$: $x=15^\circ+30^\circ k$.<br>Наименьший корень в промежутке: $k=-6$, $x=-165^\circ$ (при $k\le-7$ значение меньше $-180^\circ$).`},
  {t:'num', a:2,
   q:R`Найдите количество корней уравнения $\cos^2x-7\sin^2x=3\sin 2x$ на промежутке $[0;\,\pi]$.`,
   sol:R`$\cos^2x-7\sin^2x=6\sin x\cos x$ — однородное уравнение. Делим на $\cos^2x$ ($\cos x=0$ не является корнем): $1-7\operatorname{tg}^2x=6\operatorname{tg}x$.<br>$7t^2+6t-1=0$, $t=\frac17$ или $t=-1$.<br>На $[0;\pi]$: $\operatorname{tg}x=\frac17$ даёт один корень, $\operatorname{tg}x=-1$ даёт $x=\frac{3\pi}{4}$. Всего 2 корня. График показывает те же две точки пересечения на [0; π].`,
   graph:{bounds:{left:-0.4,right:3.6,bottom:-3,top:3},
    exprs:[R`y=\tan\left(x\right)\left\{0\le x\le\pi\right\}`,R`y=\frac{1}{7}\left\{0\le x\le\pi\right\}`,R`y=-1\left\{0\le x\le\pi\right\}`,R`\left(\arctan\left(\frac{1}{7}\right),\frac{1}{7}\right)`,R`\left(\frac{3\pi}{4},-1\right)`]}},
  {t:'num', a:-445,
   q:R`Найдите (в градусах) сумму различных корней уравнения $2\sin 6x\cos 6x-\sin 12x\sin 9x=0$ на промежутке $(-110^\circ;\,-30^\circ)$.`,
   sol:R`$\sin12x(1-\sin9x)=0$.<br>$\sin12x=0$: $x=15^\circ n$; в промежутке: $-105^\circ,-90^\circ,-75^\circ,-60^\circ,-45^\circ$.<br>$\sin9x=1$: $x=10^\circ+40^\circ n$; в промежутке: $-70^\circ$.<br>Сумма: $-375^\circ-70^\circ=-445^\circ$.`},
  {t:'num', a:180,
   q:R`Решите уравнение $\cos 2x+10\sin x-9=0$. В ответе укажите наименьший корень (в градусах), принадлежащий промежутку $[0^\circ;\,90^\circ]$, умноженный на два.`,
   sol:R`$1-2\sin^2x+10\sin x-9=0$, $\sin^2x-5\sin x+4=0$, $\sin x=1$ или $\sin x=4$ (нет корней).<br>$x=90^\circ+360^\circ n$; на $[0^\circ;90^\circ]$ корень $90^\circ$. $90\cdot2=180$.`},
  {t:'num', a:-15,
   q:R`Найдите сумму (в градусах) наименьшего положительного и наибольшего отрицательного корней уравнения $\sin 4x-\sqrt3\cos 2x=0$.`,
   sol:R`$\cos2x\,(2\sin2x-\sqrt3)=0$.<br>$x=\frac{\pi}{4}+\frac{\pi n}{2}$, $x=\frac{\pi}{6}+\pi k$, $x=\frac{\pi}{3}+\pi m$.<br>Наибольший отрицательный корень: $-\frac{\pi}{4}=-45^\circ$; наименьший положительный: $\frac{\pi}{6}=30^\circ$. Сумма $-15^\circ$.`},
  {t:'num', a:-45,
   q:R`Найдите (в градусах) наибольший отрицательный корень уравнения $\dfrac{\cos(5\pi-2x)}{1+\cos\left(\frac{3\pi}{2}-2x\right)}=0$.`,
   sol:R`По формулам приведения: $\frac{-\cos2x}{1-\sin2x}=0$.<br>$\cos2x=0$ и $\sin2x\ne1$: $2x=\frac{\pi}{2}+\pi n$, $2x\ne\frac{\pi}{2}+2\pi n$, откуда $x=\frac{3\pi}{4}+\pi k$.<br>Наибольший отрицательный корень при $k=-1$: $x=-\frac{\pi}{4}=-45^\circ$.`},
  {t:'num', a:180,
   q:R`Найдите (в градусах) наименьший положительный корень уравнения $\sqrt{1+\cos x}=-\sin x$.`,
   sol:R`Условие: $\sin x\le0$. Возводим в квадрат: $1+\cos x=1-\cos^2x$, $\cos x(1+\cos x)=0$.<br>С учётом $\sin x\le0$: $x=-\frac{\pi}{2}+2\pi n$ или $x=\pi+2\pi n$.<br>Положительные корни: $180^\circ$ и $270^\circ$. Наименьший — $180^\circ$.`}
  ]},
tr: {
  title: "Преобразование тригонометрических выражений",
  desc: "10 заданий: вычисления, обратные функции, формулы приведения; ответ — число, один или несколько вариантов.",
  qs: [
  {t:'one', a:4,
   q:R`Значение выражения $\operatorname{arcctg}\left(\operatorname{tg}\dfrac{3\pi}{5}\right)-\dfrac{3\pi}{5}$ равно:`,
   opts:[R`$0$`,R`$-\pi$`,R`$-\dfrac{7\pi}{10}$`,R`$\dfrac{9\pi}{10}$`,R`$\dfrac{3\pi}{10}$`],
   sol:R`$\operatorname{arcctg}(\operatorname{ctg}\alpha)=\alpha$ только при $\alpha\in(0;\pi)$. $\operatorname{tg}\frac{3\pi}{5}=\operatorname{ctg}\left(\frac{\pi}{2}-\frac{3\pi}{5}\right)=\operatorname{ctg}\left(-\frac{\pi}{10}\right)=\operatorname{ctg}\frac{9\pi}{10}$.<br>$\frac{9\pi}{10}-\frac{3\pi}{5}=\frac{3\pi}{10}$.`},
  {t:'num', a:-45,
   q:R`Найдите значение выражения $15\sqrt3\,\operatorname{tg}\dfrac{8\pi}{3}$.`,
   sol:R`$\operatorname{tg}\frac{8\pi}{3}=\operatorname{tg}\frac{2\pi}{3}=-\sqrt3$. $15\sqrt3\cdot(-\sqrt3)=-45$.`},
  {t:'num', a:12,
   q:R`Найдите значение выражения $\dfrac{18}{\pi}\arccos\left(-\dfrac12\right)$.`,
   sol:R`$\arccos\left(-\frac12\right)=\pi-\arccos\frac12=\pi-\frac{\pi}{3}=\frac{2\pi}{3}$. $\frac{18}{\pi}\cdot\frac{2\pi}{3}=12$.`},
  {t:'one', a:3,
   q:R`Значение выражения $\cos\dfrac{\pi}{6}\cdot\operatorname{tg}\dfrac{2\pi}{3}$ равно:`,
   opts:[R`$-6$`,R`$-2$`,R`$\dfrac32$`,R`$-\dfrac32$`,R`$6$`],
   sol:R`$\operatorname{tg}\frac{2\pi}{3}=\operatorname{tg}\left(\pi-\frac{\pi}{3}\right)=-\operatorname{tg}\frac{\pi}{3}=-\sqrt3$.<br>$\frac{\sqrt3}{2}\cdot(-\sqrt3)=-\frac32$.`},
  {t:'one', a:0,
   q:R`Среди значений аргумента, равных $-\dfrac{5\pi}{2},\ -6\pi,\ \dfrac{\pi}{6},\ \dfrac{\pi}{4},\ -\dfrac{\pi}{3}$, укажите то, при котором значение функции $y=\cos x$ равно нулю.`,
   opts:[R`$-\dfrac{5\pi}{2}$`,R`$-6\pi$`,R`$\dfrac{\pi}{6}$`,R`$\dfrac{\pi}{4}$`,R`$-\dfrac{\pi}{3}$`],
   sol:R`$\cos x=0$ при $x=\frac{\pi}{2}+\pi n$. При $n=-3$: $x=-\frac{5\pi}{2}$.`},
  {t:'one', a:0,
   q:R`Найдите значение выражения $\dfrac{78}{\pi}\arcsin\left(-\dfrac12\right)-6$.`,
   opts:[R`$-19$`,R`$-33$`,R`$19$`,R`$7$`,R`$-7$`],
   sol:R`$\arcsin\left(-\frac12\right)=-\frac{\pi}{6}$. $\frac{78}{\pi}\cdot\left(-\frac{\pi}{6}\right)-6=-13-6=-19$.`},
  {t:'num', a:-8,
   q:R`Найдите значение выражения $18\cos\left(\alpha+\dfrac{\pi}{4}\right)$, если $\sin 2\alpha=\dfrac{49}{81}$, $2\alpha\in\left(\dfrac{\pi}{2};\,\pi\right)$.`,
   sol:R`$\frac{\pi}{4}<\alpha<\frac{\pi}{2}$, поэтому $\frac{\pi}{2}<\alpha+\frac{\pi}{4}<\frac{3\pi}{4}$ и косинус отрицателен.<br>$\cos^2\left(\alpha+\frac{\pi}{4}\right)=\frac12(1-\sin2\alpha)=\frac12\cdot\frac{32}{81}=\frac{16}{81}$, $\cos\left(\alpha+\frac{\pi}{4}\right)=-\frac49$.<br>$18\cdot\left(-\frac49\right)=-8$.`},
  {t:'one', a:0,
   q:R`Значение выражения $10\sin\dfrac{11\pi}{12}\cos\dfrac{11\pi}{12}$ равно:`,
   opts:[R`$-2{,}5$`,R`$2{,}5$`,R`$-\dfrac{5\sqrt3}{2}$`,R`$\dfrac{5\sqrt3}{2}$`,R`$\dfrac{5\sqrt2}{2}$`],
   sol:R`$10\sin\frac{11\pi}{12}\cos\frac{11\pi}{12}=5\sin\frac{11\pi}{6}=5\sin\left(2\pi-\frac{\pi}{6}\right)=-5\sin\frac{\pi}{6}=-2{,}5$.`},
  {t:'num', a:-0.875,
   q:R`Найдите значение выражения $\dfrac{2\sin2\alpha-3}{2\cos^2\alpha}$, если $\operatorname{tg}\alpha=\dfrac12$, $\alpha\in\left(0;\,\dfrac{\pi}{2}\right)$. (Ответ — десятичная дробь.)`,
   sol:R`На промежутке $\cos\alpha\ne0$. Записываем $3=3\sin^2\alpha+3\cos^2\alpha$ и делим числитель и знаменатель на $\cos^2\alpha$:<br>$\frac{4\operatorname{tg}\alpha-3\operatorname{tg}^2\alpha-3}{2}=\frac{2-\frac34-3}{2}=-\frac78=-0{,}875$.`},
  {t:'multi', a:[0,2,4],
   q:R`Выберите три верных утверждения, если известно, что $\sin\alpha=\sin23^\circ$ и $\cos\alpha=-\cos23^\circ$.`,
   opts:[R`$\sin(\alpha+23^\circ)=0$`,R`$\operatorname{tg}\alpha>0$`,R`$\operatorname{ctg}\alpha<0$`,R`$\alpha$ — угол первой четверти`,R`$\sin^2\alpha+\cos^223^\circ=1$`,R`$\alpha=-23^\circ$`],
   sol:R`$\cos\alpha<0$, $\sin\alpha>0$, значит $\alpha=180^\circ-23^\circ=157^\circ$ (вторая четверть).<br>1) $\sin(157^\circ+23^\circ)=\sin180^\circ=0$ — верно. 2) $\operatorname{tg}\alpha<0$ — неверно. 3) $\operatorname{ctg}\alpha<0$ — верно. 4) неверно. 5) $\sin^2\alpha=\sin^223^\circ$, сумма равна 1 — верно. 6) неверно.`}
  ]}
};

const FIGS = {}; /* 'номер рисунка': 'data:image/png;base64,...' */
const fig = (id, cap) => `<figure class="fig"><div class="figbox">${FIGS[id] ? `<img src="${FIGS[id]}" alt="Рисунок ${id}">` : `<div class="figph">Рисунок ${id}</div>`}</div><figcaption>Рисунок ${id} – ${cap}</figcaption></figure>`;

const THEORY = [
{id:'t1', num:'1.1', title:'Единичная окружность. Градусная и радианная мера угла. Синус, косинус, тангенс и котангенс',
 html:()=>String.raw`
<p>В курсе геометрии 9 класса синус, косинус, тангенс и котангенс изучались для углов от $0^\circ$ до $180^\circ$. В 10 классе эти функции определяются для любых углов, в том числе для углов от $0^\circ$ до $360^\circ$ и далее.</p>
<p>Ключевая идея: связь между множеством действительных чисел $\mathbb R$ и точками единичной окружности. На координатной прямой каждому числу соответствует одна точка и наоборот. На числовой окружности каждому числу соответствует одна точка, но каждой точке соответствует бесконечно много чисел.</p>
${def(String.raw`Окружность на координатной плоскости, радиус которой равен единице и центр которой находится в начале координат, называется <b>единичной окружностью</b>.`)}
${fig('1.1','Единичная окружность')}
${alg('Алгоритм построения единичной окружности',String.raw`<ol><li>Указываем начало отсчёта.</li><li>Определяем направление движения точки по окружности: против часовой стрелки — положительное, по часовой — отрицательное.</li></ol>`)}
${alg('Алгоритм построения точки единичной окружности',String.raw`<ol><li>Указываем, какая точка поворачивается: $P_0(1;0)$.</li><li>Задаём центр поворота — начало координат.</li><li>Определяем угол поворота $\alpha$.</li></ol>`)}
<p>Точка $P_\alpha$ получена поворотом точки $P_0(1;0)$ вокруг начала координат на угол $\alpha$.</p>
${fig('1.2','Построение точки $P_\\alpha$')}
<h3>Радианная мера угла</h3>
${def(String.raw`Угол в <b>1 радиан</b> — это угол поворота, при котором конец радиуса описывает дугу, длина которой равна радиусу.`)}
<p>По формуле длины окружности $C=2\pi R$ длина единичной окружности равна $2\pi$. Основное соотношение для перехода между мерами:</p>
${fm(String.raw`$$\pi\ \text{рад}=180^\circ,\qquad 1^\circ=\frac{\pi}{180}\ \text{рад},\qquad 1\ \text{рад}=\left(\frac{180}{\pi}\right)^\circ\approx 57^\circ17'45''.$$
$$\alpha^\circ=\frac{\pi\alpha}{180}\ \text{рад},\qquad a\ \text{рад}=\left(\frac{180\,a}{\pi}\right)^\circ.$$`)}
<p>Радианы переводят тригонометрические функции с угловым аргументом в числовой эквивалент. В быту чаще используют градусы, но радианная мера незаменима в науке и особенно удобна для вращательного движения. Задача учителя и ученика — свободно владеть обеими мерами.</p>
<h3>Синус и косинус</h3>
<p>В прямоугольном треугольнике $ABC$ с катетами $a$, $b$ и гипотенузой $c$:</p>
$$\sin\alpha=\frac{a}{c},\quad \cos\alpha=\frac{b}{c},\quad \operatorname{tg}\alpha=\frac{a}{b},\quad \operatorname{ctg}\alpha=\frac{b}{a}.$$
${fig('1.3','Треугольник $ABC$')}
<p>Построим точку $P_\alpha(x_\alpha;y_\alpha)$ поворотом точки $P_0$ на угол $\alpha$ и рассмотрим прямоугольный треугольник $P_\alpha OH$, гипотенуза которого $P_\alpha O=1$:</p>
$$\sin\alpha=\frac{P_\alpha H}{P_\alpha O}=\frac{y_\alpha}{1}=y_\alpha.$$
${fig('1.4','Построение точки $P_\\alpha$')}
${def(String.raw`<b>Синусом</b> произвольного угла $\alpha$ называется ордината точки $P_\alpha$, полученной поворотом точки $P_0(1;0)$ вокруг начала координат на угол $\alpha$: $\sin\alpha=y_\alpha$.`)}
${alg('Алгоритм нахождения синуса произвольного угла',String.raw`<ol><li>Построить точку $P_\alpha$ на единичной окружности.</li><li>Найти ординату точки $P_\alpha$.</li></ol>`)}
${ex(String.raw`Определите значение синуса для угла $215^\circ$ по рисунку.`)}
${fig('1.5','Определение значения синуса угла')}
<p><b>Ответ:</b> $\sin215^\circ\approx-0{,}6$.</p>
<p>С помощью единичной окружности значения находятся приближённо. Точные значения получаются для углов, при которых $P_\alpha$ лежит на осях координат, а также для табличных углов. Так как ординаты точек окружности меняются от $-1$ до $1$:</p>
$$-1\le\sin\alpha\le1.$$
${ex(String.raw`Постройте углы, если $\sin\alpha=\dfrac14$.<br><b>Решение.</b> Так как $y_\alpha=\sin\alpha$, отмечаем на оси ординат точку $\frac14$, проводим прямую, параллельную оси абсцисс, и находим на окружности точки $P_{\alpha_1}$ и $P_{\alpha_2}$. Заметим, что $\alpha_1+\alpha_2=180^\circ$.`)}
${fig('1.6','Полученные углы при ординате $y=\\frac14$')}
${def(String.raw`<b>Косинусом</b> произвольного угла $\alpha$ называется абсцисса точки $P_\alpha$, полученной поворотом точки $P_0(1;0)$ вокруг начала координат на угол $\alpha$: $\cos\alpha=x_\alpha$.`)}
${alg('Алгоритм нахождения косинуса произвольного угла',String.raw`<ol><li>Построить точку $P_\alpha$ на единичной окружности.</li><li>Найти абсциссу точки $P_\alpha$.</li></ol>`)}
${ex(String.raw`Определите значение косинуса для угла $215^\circ$ по рисунку.`)}
${fig('1.7','Определение значения косинуса угла')}
<p><b>Ответ:</b> $\cos215^\circ\approx-0{,}8$. Так как абсциссы точек окружности меняются от $-1$ до $1$: $-1\le\cos\alpha\le1$.</p>
${ex(String.raw`Постройте углы, если $\cos\alpha=0{,}8$.<br><b>Решение.</b> Так как $x_\alpha=\cos\alpha$, отмечаем $0{,}8$ на оси абсцисс, проводим прямую, параллельную оси ординат, и находим точки $P_{\alpha_1}$, $P_{\alpha_2}$. Заметим, что $\alpha_1+\alpha_2=360^\circ$.`)}
${fig('1.8','Полученные углы при абсциссе $x=0{,}8$')}
<h3>Тангенс и котангенс</h3>
${def(String.raw`<b>Тангенсом</b> угла $\alpha$ называется отношение синуса угла $\alpha$ к его косинусу: $\operatorname{tg}\alpha=\dfrac{\sin\alpha}{\cos\alpha}$.`)}
<p>Так как $\cos\frac{\pi}{2}=0$, то $\operatorname{tg}\frac{\pi}{2}$ не существует.</p>
<p>К понятию тангенса приходим через подобие треугольников. Через точку $P_0$ проведём прямую, перпендикулярную оси абсцисс, и продолжим луч $OP_\alpha$ до пересечения с ней в точке $A$. Треугольники $OAP_0$ и $OP_\alpha H$ подобны (по острому углу), откуда</p>
$$\frac{AP_0}{OP_0}=\frac{P_\alpha H}{OH}\ \Rightarrow\ \frac{AP_0}{1}=\frac{\sin\alpha}{\cos\alpha}=\operatorname{tg}\alpha.$$
<p>Значит, ордината точки $A$ равна тангенсу угла $\alpha$.</p>
${fig('1.9','Ось тангенсов')}
${def(String.raw`Прямая, перпендикулярная оси абсцисс и проходящая через точку $P_0$, называется <b>осью тангенсов</b>.`)}
${alg('Алгоритм нахождения тангенса произвольного угла',String.raw`<ol><li>Построить точку $P_\alpha$ на единичной окружности.</li><li>Продолжить прямую $OP_\alpha$ до пересечения с осью тангенсов.</li><li>Найти ординату точки пересечения прямой $OP_\alpha$ с осью тангенсов.</li></ol>`)}
${fig('1.10','Тангенс произвольного угла')}
<p>С помощью оси тангенсов значение указывается лишь приближённо. Для точных вычислений используют таблицы (Брадиса) или калькулятор.</p>
${def(String.raw`<b>Котангенсом</b> угла $\alpha$ называется отношение косинуса угла $\alpha$ к его синусу: $\operatorname{ctg}\alpha=\dfrac{\cos\alpha}{\sin\alpha}$.`)}
<p>Так как $\sin0=0$, то $\operatorname{ctg}0$ не существует.</p>
<p>Через точку $P_{90^\circ}$ проведём прямую, перпендикулярную оси ординат, и продолжим луч $OP_\alpha$ до пересечения с ней в точке $A$. Из подобия треугольников $OAP_{90^\circ}$ и $P_\alpha OH$:</p>
$$\frac{AP_{90^\circ}}{OP_{90^\circ}}=\frac{OH}{P_\alpha H}\ \Rightarrow\ AP_{90^\circ}=\frac{\cos\alpha}{\sin\alpha}=\operatorname{ctg}\alpha.$$
<p>Абсцисса точки $A$ равна котангенсу $\alpha$. Прямая, перпендикулярная оси ординат и проходящая через $P_{90^\circ}$, называется <b>осью котангенсов</b>.</p>
${alg('Алгоритм нахождения котангенса произвольного угла',String.raw`<ol><li>Построить точку $P_\alpha$ на единичной окружности.</li><li>Продолжить прямую $OP_\alpha$ до пересечения с осью котангенсов.</li><li>Найти абсциссу точки пересечения.</li></ol>`)}
${fig('1.11','Котангенс произвольного угла')}
`},

{id:'t2', num:'1.2', title:'Тригонометрические тождества',
 html:()=>String.raw`
<p>Центр единичной окружности — начало координат, радиус равен 1, поэтому её уравнение $x^2+y^2=1$. Координаты точки $P_\alpha$: $x=\cos\alpha$, $y=\sin\alpha$. Подставив их в уравнение окружности, получаем:</p>
${fm(String.raw`$$\sin^2\alpha+\cos^2\alpha=1$$`)}
<p>Это <b>основное тригонометрическое тождество</b> (тригонометрическая единица). Зная синус или косинус угла, с его помощью находят другую функцию.</p>
${ex(String.raw`Известно, что $\cos\alpha=\dfrac35$. Найдите $\sin\alpha$, если $\alpha\in\left(\dfrac{3\pi}{2};2\pi\right)$.<br>
<b>Решение.</b> $\sin^2\alpha=1-\cos^2\alpha=1-\dfrac{9}{25}=\dfrac{16}{25}$, значит $\sin\alpha=\dfrac45$ или $\sin\alpha=-\dfrac45$. Угол $\alpha$ лежит в четвёртой четверти, где $\sin\alpha\lt0$, поэтому $\sin\alpha=-\dfrac45$.<br><b>Ответ:</b> $-\dfrac45$.`)}
<h3>Связь с тангенсом и котангенсом</h3>
${fm(String.raw`$$\operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha},\quad \alpha\ne\frac{\pi}{2}+\pi n,\ n\in\mathbb Z$$
$$\operatorname{ctg}\alpha=\frac{\cos\alpha}{\sin\alpha},\quad \alpha\ne\pi n,\ n\in\mathbb Z$$
$$\operatorname{tg}\alpha\cdot\operatorname{ctg}\alpha=1,\quad \alpha\ne\frac{\pi n}{2},\ n\in\mathbb Z$$`)}
<p>При $\alpha=\frac{\pi}{2}+\pi n$ абсцисса точки окружности равна нулю, то есть $\cos\alpha=0$ и дробь $\frac{\sin\alpha}{\cos\alpha}$ не имеет смысла. Аналогично при $\alpha=\pi n$ имеем $\sin\alpha=0$.</p>
<p>Разделим обе части основного тождества на $\cos^2\alpha$ и на $\sin^2\alpha$:</p>
${fm(String.raw`$$1+\operatorname{tg}^2\alpha=\frac{1}{\cos^2\alpha},\quad \alpha\ne\frac{\pi}{2}+\pi n,\ n\in\mathbb Z$$
$$1+\operatorname{ctg}^2\alpha=\frac{1}{\sin^2\alpha},\quad \alpha\ne\pi n,\ n\in\mathbb Z$$`)}
<p>Эти формулы описывают соотношения между синусом, косинусом, тангенсом и котангенсом одного и того же угла и позволяют найти значения остальных функций, если известно значение одной из них.</p>
`},

{id:'t3', num:'1.3', title:'Функции y = sin x, y = cos x, y = tg x, y = ctg x. Свойства и графики',
 html:()=>String.raw`
<h3>Функция y = sin x</h3>
${def(String.raw`Зависимость, при которой каждому действительному числу $x$ соответствует значение $\sin x$, называется функцией $y=\sin x$.`)}
<ol class="props">
<li><b>Область определения:</b> $D(\sin x)=\mathbb R$, так как для любого $x$ существует $\sin x$.</li>
<li><b>Множество значений:</b> $E(\sin x)=[-1;1]$, так как ординаты точек единичной окружности меняются от $-1$ до $1$.</li>
<li><b>Периодичность.</b> Точки $P_\alpha$, $P_{\alpha+2\pi}$, $P_{\alpha-2\pi}$ совпадают, поэтому $\sin\alpha=\sin(\alpha+2\pi)=\sin(\alpha-2\pi)$. Число $2\pi$ — период функции.</li>
</ol>
${def(String.raw`Функция $y=f(x)$ называется <b>периодической</b> с периодом $T\ne0$, если для любого $x$ из области определения числа $x+T$ и $x-T$ тоже принадлежат области определения и выполняется равенство $f(x+T)=f(x-T)=f(x)$.`)}
<p>Наименьший положительный период функции $y=\sin x$ равен $T=2\pi$.</p>
<ol class="props" start="4">
<li><b>Чётность.</b> Область определения симметрична относительно нуля. Точки $P_\alpha$ и $P_{-\alpha}$ симметричны относительно оси абсцисс, их ординаты противоположны: $\sin(-\alpha)=-\sin\alpha$. Функция <b>нечётная</b>.</li>
</ol>
${fig('1.12','Чётность функции $y=\\sin x$')}
<ol class="props" start="5">
<li><b>Нули функции.</b> Ординаты точек $P_0(1;0)$ и $P_\pi(-1;0)$ равны нулю, значит $\sin x=0$ при $x=\pi n$, $n\in\mathbb Z$.</li>
</ol>
${fig('1.13','Нули функции $y=\\sin x$')}
<ol class="props" start="6">
<li><b>Знакопостоянство.</b> $y\gt0$ при $x\in(2\pi n;\ \pi+2\pi n)$ (первая и вторая четверти); $y\lt0$ при $x\in(\pi+2\pi n;\ 2\pi+2\pi n)$ (третья и четвёртая), $n\in\mathbb Z$.</li>
<li><b>Монотонность.</b> Возрастает на $\left[-\frac{\pi}{2}+2\pi n;\ \frac{\pi}{2}+2\pi n\right]$, убывает на $\left[\frac{\pi}{2}+2\pi n;\ \frac{3\pi}{2}+2\pi n\right]$, $n\in\mathbb Z$. Наибольшее значение $1$ достигается при $x=\frac{\pi}{2}+2\pi n$, наименьшее $-1$ — при $x=-\frac{\pi}{2}+2\pi n$.</li>
</ol>
<p>График функции $y=\sin x$ называется <b>синусоидой</b>.</p>
${fig('1.14','График функции $y=\\sin x$')}

<h3>Функция y = cos x</h3>
${def(String.raw`Зависимость, при которой каждому действительному числу $x$ соответствует значение $\cos x$, называется функцией $y=\cos x$.`)}
<ol class="props">
<li><b>Область определения:</b> $D(\cos x)=\mathbb R$.</li>
<li><b>Множество значений:</b> $E(\cos x)=[-1;1]$, так как абсциссы точек окружности меняются от $-1$ до $1$.</li>
<li><b>Периодичность.</b> $\cos\alpha=\cos(\alpha+2\pi)=\cos(\alpha-2\pi)$, наименьший положительный период $T=2\pi$.</li>
<li><b>Чётность.</b> Точки $P_\alpha$ и $P_{-\alpha}$ симметричны относительно оси абсцисс, их абсциссы равны: $\cos(-\alpha)=\cos\alpha$. Функция <b>чётная</b>.</li>
</ol>
${fig('1.15','Чётность функции $y=\\cos x$')}
<ol class="props" start="5">
<li><b>Нули функции.</b> Абсциссы точек $P_{\pi/2}(0;1)$ и $P_{3\pi/2}(0;-1)$ равны нулю, поэтому $\cos x=0$ при $x=\frac{\pi}{2}+\pi n$, $n\in\mathbb Z$.</li>
</ol>
${fig('1.16','Нули функции $y=\\cos x$')}
<ol class="props" start="6">
<li><b>Знакопостоянство.</b> $y\gt0$ при $x\in\left(-\frac{\pi}{2}+2\pi n;\ \frac{\pi}{2}+2\pi n\right)$ (первая и четвёртая четверти); $y\lt0$ при $x\in\left(\frac{\pi}{2}+2\pi n;\ \frac{3\pi}{2}+2\pi n\right)$ (вторая и третья).</li>
<li><b>Монотонность.</b> Возрастает на $[-\pi+2\pi n;\ 2\pi n]$, убывает на $[2\pi n;\ \pi+2\pi n]$. Наибольшее значение $1$ при $x=2\pi n$, наименьшее $-1$ при $x=\pi+2\pi n$, $n\in\mathbb Z$.</li>
</ol>
<p>График функции $y=\cos x$ называется <b>косинусоидой</b>.</p>
${fig('1.17','График функции $y=\\cos x$')}

<h3>Функция y = tg x</h3>
${def(String.raw`Зависимость, при которой каждому действительному числу $x\ne\frac{\pi}{2}+\pi n$, $n\in\mathbb Z$, соответствует значение $\operatorname{tg}x$, называется функцией $y=\operatorname{tg}x$.`)}
<ol class="props">
<li><b>Область определения:</b> все действительные числа, кроме $\frac{\pi}{2}+\pi n$, $n\in\mathbb Z$ (где $\cos x=0$).</li>
<li><b>Множество значений:</b> $E(\operatorname{tg}x)=(-\infty;+\infty)$.</li>
<li><b>Периодичность.</b> Наименьший положительный период $T=\pi$: $\operatorname{tg}\alpha=\operatorname{tg}(\alpha+\pi)=\operatorname{tg}(\alpha-\pi)$.</li>
<li><b>Чётность.</b> Функция нечётная: $\operatorname{tg}(-x)=-\operatorname{tg}x$.</li>
<li><b>Нули функции:</b> $x=\pi n$, $n\in\mathbb Z$ (где $\sin x=0$).</li>
<li><b>Знакопостоянство.</b> $y\gt0$ при $x\in\left(\pi n;\ \frac{\pi}{2}+\pi n\right)$ (первая и третья четверти, синус и косинус одного знака); $y\lt0$ при $x\in\left(-\frac{\pi}{2}+\pi n;\ \pi n\right)$ (вторая и четвёртая четверти).</li>
<li><b>Монотонность.</b> Возрастает на каждом промежутке $\left(-\frac{\pi}{2}+\pi n;\ \frac{\pi}{2}+\pi n\right)$. Наибольшего и наименьшего значений нет.</li>
</ol>
<p>График функции $y=\operatorname{tg}x$ называется <b>тангенсоидой</b>.</p>
${fig('1.18','График функции $y=\\operatorname{tg}x$')}

<h3>Функция y = ctg x</h3>
${def(String.raw`Зависимость, при которой каждому действительному числу $x\ne\pi n$, $n\in\mathbb Z$, соответствует значение $\operatorname{ctg}x$, называется функцией $y=\operatorname{ctg}x$.`)}
<ol class="props">
<li><b>Область определения:</b> все действительные числа, кроме $\pi n$, $n\in\mathbb Z$ (где $\sin x=0$).</li>
<li><b>Множество значений:</b> $E(\operatorname{ctg}x)=(-\infty;+\infty)$.</li>
<li><b>Периодичность.</b> Наименьший положительный период $T=\pi$: $\operatorname{ctg}\alpha=\operatorname{ctg}(\alpha+\pi)=\operatorname{ctg}(\alpha-\pi)$.</li>
<li><b>Чётность.</b> Функция нечётная: $\operatorname{ctg}(-x)=-\operatorname{ctg}x$.</li>
<li><b>Нули функции:</b> $x=\frac{\pi}{2}+\pi n$, $n\in\mathbb Z$ (где $\cos x=0$).</li>
<li><b>Знакопостоянство.</b> $y\gt0$ при $x\in\left(\pi n;\ \frac{\pi}{2}+\pi n\right)$; $y\lt0$ при $x\in\left(\frac{\pi}{2}+\pi n;\ \pi+\pi n\right)$.</li>
<li><b>Монотонность.</b> Убывает на каждом промежутке $(\pi n;\ \pi+\pi n)$. Наибольшего и наименьшего значений нет.</li>
</ol>
<p>График функции $y=\operatorname{ctg}x$ называется <b>котангенсоидой</b>.</p>
${fig('1.19','График функции $y=\\operatorname{ctg}x$')}

<h3>Сводная таблица</h3>
<div class="tablewrap"><table class="tbl">
<tr><th></th><th>$\sin x$</th><th>$\cos x$</th><th>$\operatorname{tg}x$</th><th>$\operatorname{ctg}x$</th></tr>
<tr><td>Область определения</td><td>$\mathbb R$</td><td>$\mathbb R$</td><td>$x\ne\frac{\pi}{2}+\pi n$</td><td>$x\ne\pi n$</td></tr>
<tr><td>Множество значений</td><td>$[-1;1]$</td><td>$[-1;1]$</td><td>$\mathbb R$</td><td>$\mathbb R$</td></tr>
<tr><td>Период</td><td>$2\pi$</td><td>$2\pi$</td><td>$\pi$</td><td>$\pi$</td></tr>
<tr><td>Чётность</td><td>нечётная</td><td>чётная</td><td>нечётная</td><td>нечётная</td></tr>
<tr><td>Нули</td><td>$\pi n$</td><td>$\frac{\pi}{2}+\pi n$</td><td>$\pi n$</td><td>$\frac{\pi}{2}+\pi n$</td></tr>
</table></div>
`},

{id:'t4', num:'1.4', title:'Обратные тригонометрические функции. Формулы приведения',
 html:()=>String.raw`
<p>При изучении тригонометрических функций возникает обратная задача: найти значение аргумента, при котором функция равна заданному числу. Например, найдём все $x$, при которых $\sin x=\frac12$. Отметим $\frac12$ на оси ординат и проведём через эту точку прямую, параллельную оси абсцисс.</p>
${fig('1.20','Прямая, проведённая через точку $\\left(0;\\frac12\\right)$ параллельно оси абсцисс')}
<p>На окружности найдём точки $P_{\alpha_1}$ и $P_{\alpha_2}$ с ординатой $\frac12$. Им соответствуют углы $\frac{\pi}{6}+2\pi n$ и $\frac{5\pi}{6}+2\pi n$, $n\in\mathbb Z$, то есть бесконечно много углов. Но на промежутке $\left[-\frac{\pi}{2};\frac{\pi}{2}\right]$ такое значение единственное: $\frac{\pi}{6}$.</p>
${fig('1.21','Угол, равный $\\frac{\\pi}{6}$')}
<h3>Арксинус</h3>
${def(String.raw`<b>Арксинусом</b> числа $a$ называется угол $\alpha$, принадлежащий промежутку $\left[-\dfrac{\pi}{2};\dfrac{\pi}{2}\right]$, синус которого равен $a$.`)}
${fig('1.22','Арксинус числа $a$')}
<p>Точки $P_\alpha$ и $P_{-\alpha}$, $\alpha\in\left[-\frac{\pi}{2};\frac{\pi}{2}\right]$, имеют ординаты $a$ и $-a$, а соответствующие углы отличаются знаком:</p>
$$\arcsin(-a)=-\arcsin a,\quad a\in[-1;1].$$
${fig('1.23','Арксинус числа $-a$')}
<p>Область определения $\arcsin a$ — отрезок $[-1;1]$. При $|a|\gt1$ выражение не имеет смысла. Из определения:</p>
$$\sin(\arcsin a)=a\ \text{ при }a\in[-1;1];\qquad \arcsin(\sin\alpha)=\alpha\ \text{ при }\alpha\in\left[-\frac{\pi}{2};\frac{\pi}{2}\right].$$
<h3>Арккосинус</h3>
<p>На промежутке $[0;\pi]$ функция $y=\cos x$ убывает и принимает все значения от $1$ до $-1$, поэтому для любого $a\in[-1;1]$ есть единственное $x\in[0;\pi]$, при котором $\cos x=a$.</p>
${def(String.raw`<b>Арккосинусом</b> числа $a$ называется угол из промежутка $[0;\pi]$, косинус которого равен $a$.`)}
${fig('1.24','Арккосинус числа $a$')}
<p>Пусть $\alpha=\arccos a$. Точки $P_\alpha$ и $P_{\pi-\alpha}$ имеют противоположные абсциссы: $\cos(\pi-\alpha)=-a$, причём $\pi-\alpha\in[0;\pi]$. По определению $\arccos(-a)=\pi-\alpha$, то есть</p>
$$\arccos(-a)=\pi-\arccos a,\quad a\in[-1;1].$$
${fig('1.25','Арккосинус числа $-a$')}
<p>Область определения $\arccos a$ — отрезок $[-1;1]$. Из определения:</p>
$$\cos(\arccos a)=a\ \text{ при }a\in[-1;1];\qquad \arccos(\cos\alpha)=\alpha\ \text{ при }\alpha\in[0;\pi].$$
<h3>Арктангенс</h3>
<p>На промежутке монотонности $\left(-\frac{\pi}{2};\frac{\pi}{2}\right)$ функции $y=\operatorname{tg}x$ существует единственный угол, тангенс которого равен заданному числу $a$.</p>
${def(String.raw`<b>Арктангенсом</b> числа $a$ называется угол из промежутка $\left(-\dfrac{\pi}{2};\dfrac{\pi}{2}\right)$, тангенс которого равен $a$.`)}
${fig('1.26','Арктангенс числа $a$')}
$$\operatorname{tg}(\operatorname{arctg}a)=a\ \text{ при }a\in\mathbb R;\qquad \operatorname{arctg}(\operatorname{tg}\alpha)=\alpha\ \text{ при }\alpha\in\left(-\frac{\pi}{2};\frac{\pi}{2}\right).$$
<h3>Арккотангенс</h3>
${def(String.raw`<b>Арккотангенсом</b> числа $a$ называется угол из промежутка $(0;\pi)$, котангенс которого равен $a$.`)}
${fig('1.27','Арккотангенс числа $a$')}
<p>Для любого $a\in\mathbb R$ верно равенство $\operatorname{arcctg}(-a)=\pi-\operatorname{arcctg}a$.</p>
${fig('1.28','Арккотангенс числа $-a$')}
$$\operatorname{ctg}(\operatorname{arcctg}a)=a\ \text{ при }a\in\mathbb R;\qquad \operatorname{arcctg}(\operatorname{ctg}\alpha)=\alpha\ \text{ при }\alpha\in(0;\pi).$$

<h3>Формулы приведения</h3>
<p>Вычислять значения тригонометрических функций больших углов нерационально. Периодичность позволяет свести вычисление к аргументам из промежутка $[0;2\pi]$:</p>
$$\sin390^\circ=\sin(360^\circ+30^\circ)=\sin30^\circ=\frac12;\qquad \operatorname{ctg}\frac{17\pi}{4}=\operatorname{ctg}\left(4\pi+\frac{\pi}{4}\right)=\operatorname{ctg}\frac{\pi}{4}=1.$$
<p>На практике значения для произвольного угла сводят к значениям для угла из промежутка $\left(0;\frac{\pi}{2}\right)$. Это делают с помощью формул приведения.</p>
<p><b>Вторая четверть.</b> Любое число $\varphi\in\left(\frac{\pi}{2};\pi\right)$ представимо в виде $\varphi=\pi-\alpha$, где $\alpha\in\left(0;\frac{\pi}{2}\right)$ (например, $\frac{5\pi}{6}=\pi-\frac{\pi}{6}$). Соответствующие прямоугольные треугольники равны по гипотенузе и острому углу.</p>
${fig('1.29','$\\varphi=\\pi-\\alpha$')}
<p>Ординаты точек $P_\alpha$ и $P_{\pi-\alpha}$ равны, а абсциссы отличаются знаком, поэтому $\sin(\pi-\alpha)=\sin\alpha$, $\cos(\pi-\alpha)=-\cos\alpha$. Тогда</p>
$$\operatorname{tg}(\pi-\alpha)=\frac{\sin\alpha}{-\cos\alpha}=-\operatorname{tg}\alpha,\qquad \operatorname{ctg}(\pi-\alpha)=-\operatorname{ctg}\alpha.$$
<p>Это же число можно представить в виде $\varphi=\frac{\pi}{2}+\alpha$ (например, $\frac{5\pi}{6}=\frac{\pi}{2}+\frac{\pi}{3}$). Из равенства треугольников получаем $\sin\left(\frac{\pi}{2}+\alpha\right)=\cos\alpha$ и $\cos\left(\frac{\pi}{2}+\alpha\right)=-\sin\alpha$.</p>
${fig('1.30','$\\varphi=\\frac{\\pi}{2}+\\alpha$')}
$$\operatorname{tg}\left(\frac{\pi}{2}+\alpha\right)=-\operatorname{ctg}\alpha,\qquad \operatorname{ctg}\left(\frac{\pi}{2}+\alpha\right)=-\operatorname{tg}\alpha.$$
<p><b>Третья четверть.</b> Число $\varphi\in\left(\pi;\frac{3\pi}{2}\right)$ представимо в виде $\varphi=\pi+\alpha$ или $\varphi=\frac{3\pi}{2}-\alpha$, где $\alpha\in\left(0;\frac{\pi}{2}\right)$.</p>
${fig('1.31','$\\varphi=\\pi+\\alpha$')}
${fig('1.32','$\\varphi=\\frac{3\\pi}{2}-\\alpha$')}
<p><b>Четвёртая четверть.</b> Число $\varphi\in\left(\frac{3\pi}{2};2\pi\right)$ представимо в виде $\varphi=2\pi-\alpha$ или $\varphi=\frac{3\pi}{2}+\alpha$.</p>
${fig('1.33','$\\varphi=2\\pi-\\alpha$')}
${fig('1.34','$\\varphi=\\frac{3\\pi}{2}+\\alpha$')}
<p>Все формулы приведения собраны в таблице.</p>
<div class="tablewrap"><table class="tbl">
<tr><th>Аргумент</th><th>$\sin$</th><th>$\cos$</th><th>$\operatorname{tg}$</th><th>$\operatorname{ctg}$</th></tr>
<tr><td>$\frac{\pi}{2}-\alpha$</td><td>$\cos\alpha$</td><td>$\sin\alpha$</td><td>$\operatorname{ctg}\alpha$</td><td>$\operatorname{tg}\alpha$</td></tr>
<tr><td>$\frac{\pi}{2}+\alpha$</td><td>$\cos\alpha$</td><td>$-\sin\alpha$</td><td>$-\operatorname{ctg}\alpha$</td><td>$-\operatorname{tg}\alpha$</td></tr>
<tr><td>$\pi-\alpha$</td><td>$\sin\alpha$</td><td>$-\cos\alpha$</td><td>$-\operatorname{tg}\alpha$</td><td>$-\operatorname{ctg}\alpha$</td></tr>
<tr><td>$\pi+\alpha$</td><td>$-\sin\alpha$</td><td>$-\cos\alpha$</td><td>$\operatorname{tg}\alpha$</td><td>$\operatorname{ctg}\alpha$</td></tr>
<tr><td>$\frac{3\pi}{2}-\alpha$</td><td>$-\cos\alpha$</td><td>$-\sin\alpha$</td><td>$\operatorname{ctg}\alpha$</td><td>$\operatorname{tg}\alpha$</td></tr>
<tr><td>$\frac{3\pi}{2}+\alpha$</td><td>$-\cos\alpha$</td><td>$\sin\alpha$</td><td>$-\operatorname{ctg}\alpha$</td><td>$-\operatorname{tg}\alpha$</td></tr>
<tr><td>$2\pi-\alpha$</td><td>$-\sin\alpha$</td><td>$\cos\alpha$</td><td>$-\operatorname{tg}\alpha$</td><td>$-\operatorname{ctg}\alpha$</td></tr>
</table></div>
${alg('Правило применения формул приведения',String.raw`<ul><li>В правой части ставится тот знак, который имеет исходная функция в соответствующей четверти, если считать угол $\alpha$ острым.</li><li>Если аргумент имеет вид $\pi\pm\alpha$ или $2\pi\pm\alpha$, название функции <b>не меняется</b>.</li><li>Если аргумент имеет вид $\frac{\pi}{2}\pm\alpha$ или $\frac{3\pi}{2}\pm\alpha$, название функции <b>меняется</b> (синус на косинус, тангенс на котангенс и наоборот).</li></ul>`)}
`},

{id:'t5', num:'1.5', title:'Синус, косинус, тангенс суммы и разности. Формулы двойного аргумента',
 html:()=>String.raw`
<p>Известные значения тригонометрических функций позволяют вычислять значения для других углов. Но, например, $105^\circ=60^\circ+45^\circ$, а $\sin105^\circ\ne\sin60^\circ+\sin45^\circ$. Нужны формулы сложения.</p>
<h3>Синус суммы и разности</h3>
<p>Пусть $\alpha,\beta,\gamma$ — острые углы треугольника $ABC$. Выразим его площадь двумя способами.</p>
${fig('1.35','Треугольник $ABC$')}
$$S_{ABC}=\frac12ab\sin\gamma=\frac12ab\sin(\pi-(\alpha+\beta))=\frac12ab\sin(\alpha+\beta).$$
<p>С другой стороны, высота $CH$ делит треугольник на два прямоугольных, и</p>
$$S_{ABC}=S_{ACH}+S_{BCH}=\frac12\,b\cos\alpha\cdot b\sin\alpha+\frac12\,a\sin\beta\cdot a\cos\beta=\frac12ab(\sin\alpha\cos\beta+\sin\beta\cos\alpha),$$
<p>так как $b\sin\alpha=a\sin\beta$. Приравниваем площади и сокращаем на $\frac12ab$:</p>
${fm(String.raw`$$\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$$`)}
<p>Для остальных углов формула справедлива благодаря периодичности. Она решает возникшую проблему:</p>
$$\sin105^\circ=\sin(60^\circ+45^\circ)=\frac{\sqrt3}{2}\cdot\frac{\sqrt2}{2}+\frac12\cdot\frac{\sqrt2}{2}=\frac{\sqrt6+\sqrt2}{4}.$$
<p>Для разности запишем $\alpha-\beta=\alpha+(-\beta)$ и вспомним, что синус нечётен, а косинус чётен:</p>
${fm(String.raw`$$\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$$`)}
<h3>Косинус суммы и разности</h3>
<p>Применяем формулу приведения и формулу синуса разности:</p>
$$\cos(\alpha+\beta)=\sin\left(\frac{\pi}{2}-(\alpha+\beta)\right)=\sin\left(\left(\frac{\pi}{2}-\alpha\right)-\beta\right)=\cos\alpha\cos\beta-\sin\alpha\sin\beta.$$
${fm(String.raw`$$\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$$
$$\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$$`)}
<p>Чтобы запомнить формулы, сравните их: у синуса знак «между» совпадает со знаком в аргументе, у косинуса — противоположен.</p>
<h3>Тангенс суммы и разности</h3>
<p>Применим определение тангенса и формулы синуса и косинуса суммы, затем разделим числитель и знаменатель на $\cos\alpha\cos\beta$ ($\cos\alpha\ne0$, $\cos\beta\ne0$):</p>
$$\operatorname{tg}(\alpha+\beta)=\frac{\sin\alpha\cos\beta+\cos\alpha\sin\beta}{\cos\alpha\cos\beta-\sin\alpha\sin\beta}=\frac{\operatorname{tg}\alpha+\operatorname{tg}\beta}{1-\operatorname{tg}\alpha\operatorname{tg}\beta}.$$
${fm(String.raw`$$\operatorname{tg}(\alpha+\beta)=\frac{\operatorname{tg}\alpha+\operatorname{tg}\beta}{1-\operatorname{tg}\alpha\,\operatorname{tg}\beta},\qquad \operatorname{tg}(\alpha-\beta)=\frac{\operatorname{tg}\alpha-\operatorname{tg}\beta}{1+\operatorname{tg}\alpha\,\operatorname{tg}\beta}$$`)}
<p>Формулу тангенса разности получают заменой $\alpha-\beta=\alpha+(-\beta)$ с учётом нечётности тангенса.</p>
<h3>Формулы двойного аргумента</h3>
<p>Положим $\beta=\alpha$ в формулах суммы.</p>
${fm(String.raw`$$\sin2\alpha=2\sin\alpha\cos\alpha$$
$$\cos2\alpha=\cos^2\alpha-\sin^2\alpha$$
$$\operatorname{tg}2\alpha=\frac{2\operatorname{tg}\alpha}{1-\operatorname{tg}^2\alpha}$$`)}
<p>С помощью основного тождества косинус двойного аргумента записывают и так: $\cos2\alpha=1-2\sin^2\alpha=2\cos^2\alpha-1$.</p>
`},

{id:'t6', num:'1.6', title:'Преобразование суммы и разности синусов (косинусов) в произведение',
 html:()=>String.raw`
<p>Формулы преобразования суммы и разности тригонометрических функций в произведение — следствия теорем сложения. При выводе используется приём: вводят новые переменные</p>
$$\begin{cases}\alpha+\beta=x,\\ \alpha-\beta=y,\end{cases}\qquad\text{откуда}\qquad \alpha=\frac{x+y}{2},\quad \beta=\frac{x-y}{2}.$$
<h3>Сумма синусов</h3>
<p>Запишем синус суммы и синус разности и сложим почленно:</p>
$$\sin(\alpha+\beta)+\sin(\alpha-\beta)=2\sin\alpha\cos\beta.$$
<p>Подставим $\alpha$ и $\beta$ через $x$ и $y$:</p>
${fm(String.raw`$$\sin x+\sin y=2\sin\frac{x+y}{2}\cos\frac{x-y}{2}$$`)}
<p>Сумма синусов двух углов равна удвоенному произведению синуса полусуммы на косинус полуразности.</p>
<h3>Разность синусов</h3>
<p>Вычитая синус разности из синуса суммы, получаем $\sin(\alpha+\beta)-\sin(\alpha-\beta)=2\sin\beta\cos\alpha$, откуда</p>
${fm(String.raw`$$\sin x-\sin y=2\sin\frac{x-y}{2}\cos\frac{x+y}{2}$$`)}
<p>Разность синусов двух углов равна удвоенному произведению синуса полуразности на косинус полусуммы.</p>
<h3>Сумма и разность косинусов</h3>
<p>Складывая $\cos(\alpha+\beta)$ и $\cos(\alpha-\beta)$, получаем $2\cos\alpha\cos\beta$. Вычитая из первого второе, получаем $-2\sin\alpha\sin\beta$. Отсюда</p>
${fm(String.raw`$$\cos x+\cos y=2\cos\frac{x+y}{2}\cos\frac{x-y}{2}$$
$$\cos x-\cos y=-2\sin\frac{x+y}{2}\sin\frac{x-y}{2}=2\sin\frac{x+y}{2}\sin\frac{y-x}{2}$$`)}
<p>Сумма косинусов равна удвоенному произведению косинуса полусуммы на косинус полуразности. В учебнике разность косинусов запоминают в виде $\cos x-\cos y=-2\sin\frac{x-y}{2}\sin\frac{x+y}{2}$.</p>
<h3>Разноимённые функции</h3>
<p>Сумму или разность разноимённых функций сначала приводят к одному названию по формулам приведения.</p>
${ex(String.raw`Решите уравнение $\sin3x-\cos4x=0$.<br><b>Решение.</b> Заменим косинус: $\cos4x=\sin\left(\frac{\pi}{2}-4x\right)$. Тогда $\sin3x-\sin\left(\frac{\pi}{2}-4x\right)=0$, и далее применяем формулу разности синусов. Общий алгоритм: свести к одной функции и одному аргументу.`)}
`},

{id:'t7', num:'1.7', title:'Решение тригонометрических уравнений',
 html:()=>String.raw`
${def(String.raw`<b>Тригонометрическим</b> называется уравнение, содержащее переменную под знаком тригонометрической функции, независимо от его сложности и от других функций, входящих в уравнение.`)}
${ex(String.raw`$x^2+3x+\operatorname{tg}48^\circ=0$ — <b>не</b> тригонометрическое уравнение (переменной нет под знаком функции). $\operatorname{tg}x+x^2-4x+5=0$ — тригонометрическое.`)}
<p>Виды тригонометрических уравнений:</p>
<ol><li>простейшие;</li><li>алгебраические относительно какой-либо тригонометрической функции;</li><li>уравнения, требующие преобразования тригонометрического выражения, например $\sin x=5\sin2x$;</li><li>уравнения, решаемые графически, например $x^2=\cos x$.</li></ol>
<p>Главное отличие от алгебраических уравнений: если тригонометрическое уравнение имеет решение, то решений бесконечно много (из-за периодичности функций). При этом деление на $\sin x$ или $\cos x$ не приводит к потере корней, если эти функции не равны нулю одновременно, а это невозможно.</p>
${alg('Общий алгоритм решения',String.raw`<ol><li>Выразить все члены уравнения через одну тригонометрическую функцию с одинаковым аргументом.</li><li>Найти значение этой функции.</li><li>По полученным значениям найти значения аргумента.</li><li>Записать ответ по формулам решений простейших уравнений.</li><li>Проверить корни (если равносильность могла нарушиться) и объединить серии решений, если это возможно.</li></ol>`)}
<p>Основные методы: квадратное уравнение относительно тригонометрической функции; разложение левой части на множители; однородные уравнения относительно синуса и косинуса.</p>

<h3>Уравнение sin x = a</h3>
<p>При $|a|\gt1$, то есть при $a\lt-1$ или $a\gt1$, уравнение $\sin x=a$ корней не имеет, так как $E(\sin x)=[-1;1]$. Например, $\sin x=3$ не имеет корней.</p>
<p><b>Частные случаи.</b> Синус равен нулю в двух точках единичной окружности, поэтому</p>
$$\sin x=0\iff x=\pi n;\qquad \sin x=1\iff x=\frac{\pi}{2}+2\pi n;\qquad \sin x=-1\iff x=-\frac{\pi}{2}+2\pi n,\quad n\in\mathbb Z.$$
<p><b>Общий случай</b> $0\lt|a|\lt1$. Рассмотрим промежуток $[-\pi;\pi]$, равный периоду. На промежутке возрастания есть единственное значение $x=\arcsin a$, на промежутке убывания — единственное $x=\pi-\arcsin a$.</p>
${fig('1.36','Решение уравнения $\\sin x=a$')}
<p>С учётом периодичности:</p>
$$x=\arcsin a+2\pi k,\qquad x=\pi-\arcsin a+2\pi k,\quad k\in\mathbb Z.$$
<p>Запишем иначе: $x=\arcsin a+\pi\cdot2k$ (1) и $x=-\arcsin a+\pi(2k+1)$ (2). Здесь $2k$ — чётные числа, $2k+1$ — нечётные. Объединим оба множества одной переменной $n$:</p>
${fm(String.raw`$$\sin x=a\iff x=(-1)^n\arcsin a+\pi n,\quad n\in\mathbb Z,\ |a|\le1$$`)}
<p>При чётном $n$ получаем формулу (1), при нечётном — формулу (2).</p>
${ex(String.raw`Решите уравнение $\sin x=\dfrac{\sqrt2}{2}$.<br><b>Решение.</b> $x=(-1)^n\arcsin\dfrac{\sqrt2}{2}+\pi n=(-1)^n\dfrac{\pi}{4}+\pi n$, $n\in\mathbb Z$.<br><b>Ответ:</b> $x=(-1)^n\dfrac{\pi}{4}+\pi n$, $n\in\mathbb Z$.`)}

<h3>Уравнение cos x = a</h3>
<p>При $|a|\gt1$ (то есть $a\lt-1$ или $a\gt1$) уравнение $\cos x=a$ корней не имеет, так как $E(\cos x)=[-1;1]$. Например, $\cos x=-2$ не имеет корней.</p>
<p><b>Частные случаи.</b></p>
${fig('1.37','Частные случаи решения уравнения $\\cos x=a$')}
$$\cos x=0\iff x=\frac{\pi}{2}+\pi n;\qquad \cos x=1\iff x=2\pi n;\qquad \cos x=-1\iff x=\pi+2\pi n,\quad n\in\mathbb Z.$$
<p><b>Общий случай</b> $0\lt|a|\lt1$. На промежутке $[-\pi;\pi]$ косинус принимает значение $a$ в точке $x=\arccos a$. Так как косинус чётный, $x=-\arccos a$ — тоже решение.</p>
${fig('1.38','Решение уравнения $\\cos x=a$')}
${fm(String.raw`$$\cos x=a\iff x=\pm\arccos a+2\pi n,\quad n\in\mathbb Z,\ |a|\le1$$`)}
${ex(String.raw`Решите уравнение $\cos x=0{,}7$.<br><b>Ответ:</b> $x=\pm\arccos0{,}7+2\pi n$, $n\in\mathbb Z$.`)}

<h3>Уравнение tg x = a</h3>
<p>Множество значений тангенса — вся числовая прямая. На промежутке $\left(-\frac{\pi}{2};\frac{\pi}{2}\right)$ для любого $a$ существует единственное решение $x=\operatorname{arctg}a$. С учётом периода $\pi$:</p>
${fig('1.39','Решение уравнения $\\operatorname{tg}x=a$')}
${fm(String.raw`$$\operatorname{tg}x=a\iff x=\operatorname{arctg}a+\pi n,\quad n\in\mathbb Z$$`)}
${ex(String.raw`Решите уравнение $\operatorname{tg}x=\dfrac{\sqrt3}{3}$.<br><b>Решение.</b> $x=\operatorname{arctg}\dfrac{\sqrt3}{3}+\pi n=\dfrac{\pi}{6}+\pi n$.<br><b>Ответ:</b> $x=\dfrac{\pi}{6}+\pi n$, $n\in\mathbb Z$.`)}

<h3>Уравнение ctg x = a</h3>
<p>На промежутке $(0;\pi)$ для любого $a$ существует единственное решение $x=\operatorname{arcctg}a$. С учётом периода $\pi$:</p>
${fig('1.40','Решение уравнения $\\operatorname{ctg}x=a$')}
${fm(String.raw`$$\operatorname{ctg}x=a\iff x=\operatorname{arcctg}a+\pi n,\quad n\in\mathbb Z$$`)}
${ex(String.raw`Решите уравнение $\operatorname{ctg}x=1$.<br><b>Решение.</b> $x=\operatorname{arcctg}1+\pi n=\dfrac{\pi}{4}+\pi n$.<br><b>Ответ:</b> $x=\dfrac{\pi}{4}+\pi n$, $n\in\mathbb Z$.`)}
<p>Готовые тесты по этой теме — в разделе «Тесты».</p>
`},

{id:'t8', num:'2.2', title:'Типичные ошибки школьников на ЦЭ/ЦТ',
 html:()=>String.raw`
<p>Раздел «Тригонометрия» традиционно вызывает наибольшие затруднения у абитуриентов на централизованном тестировании по математике. По данным Министерства образования Республики Беларусь, в 2024 году из 54,3 тыс. абитуриентов, сдававших профильные предметы, математику выбрали 6,7 тыс. Из них 14 человек набрали 100 баллов, около 0,21%. По данным портала «Адукар», наиболее сложные темы раздела:</p>
<ul><li>преобразование тригонометрических выражений;</li><li>решение тригонометрических уравнений;</li><li>анализ графиков тригонометрических функций.</li></ul>
<p>Затруднения вызывают определения синуса, косинуса, тангенса и котангенса произвольного угла; тригонометрические тождества; определения арксинуса, арккосинуса, арктангенса и арккотангенса; формулы приведения, суммы и разности, двойного аргумента, преобразования суммы в произведение; решение уравнений.</p>
<h3>Основные группы ошибок</h3>
<ol>
<li><b>Недостаточное понимание определений и свойств.</b> Путаница со знаками функций по четвертям, неуверенное знание определений на окружности и в треугольнике, неверное применение $\sin^2\alpha+\cos^2\alpha=1$.</li>
<li><b>Ошибки при преобразованиях.</b> Неверное применение формул приведения; неправильное использование тождеств (двойной и половинный угол, сумма и разность); вычисления без учёта области определения.</li>
<li><b>Ошибки при решении уравнений.</b> Неверный период, корни вне заданного промежутка, невнимательность при записи общих формул.</li>
<li><b>Ошибки при работе с графиками.</b> Незнание графиков, периодов, трудности с поиском точек пересечения.</li>
<li><b>Вычислительные ошибки.</b> Перевод радианов в градусы и обратно, таблица значений, упрощение дробей, извлечение корней.</li>
</ol>
<h3>Разбор примеров</h3>
<div class="box ex"><b>Пример 1.</b> Определения и свойства. Найти $\cos150^\circ$.<br>Ученик записывает $\cos150^\circ=\frac{\sqrt3}{2}$, не проверив знак: во II четверти косинус отрицателен.<br><b>Правильный ответ:</b> $\cos150^\circ=-\dfrac{\sqrt3}{2}$.</div>
<div class="box ex"><b>Пример 2.</b> Преобразование выражения. Упростить $1-2\sin^2x$.<br>$1-2\sin^2x=\cos^2x+\sin^2x-2\sin^2x=\cos^2x-\sin^2x=\cos2x.$<br><b>Ответ:</b> $\cos2x$.</div>
<div class="box ex"><b>Пример 3.</b> Решить уравнение $\sin x=\dfrac12$.<br>Участники ЦТ указывают одно решение $x=\frac{\pi}{6}$, забывая о втором решении на окружности, о периоде $2\pi$ и об общей формуле для $0\lt|a|\lt1$.<br><b>Правильный ответ:</b> $x=(-1)^n\dfrac{\pi}{6}+\pi n$, $n\in\mathbb Z$.</div>
<div class="box ex"><b>Пример 4.</b> Работа с графиком. Определите количество точек пересечения графиков $y=\sin x$ и $y=\cos x$ на отрезке $[0;2\pi]$.<br>Ученики не строят графики и не учитывают периодичность. По графику видно две точки пересечения: $x=\frac{\pi}{4}$ и $x=\frac{5\pi}{4}$.</div>
${fig('2.1','Пересечение графиков $y=\\sin x$ и $y=\\cos x$ на отрезке $[0;2\\pi]$')}
${fig('2.2','Пересечение графиков $y=\\sin x$ и $y=\\cos x$ на отрезке $[0;2\\pi]$ (второй вариант построения)')}
<p><b>Правильный ответ:</b> $x=\dfrac{\pi}{4}$ и $x=\dfrac{5\pi}{4}$.</p>
<p>Анализ типичных ошибок по результатам ЦТ 2024 года показывает: нужны дополнительные тренировочные задания на преобразование выражений, решение уравнений и анализ графиков.</p>
`}

/* ===================== ДВИЖОК ===================== */
const TIME_LIMIT = 45*60;
const app = document.getElementById('app');
const timerEl = document.getElementById('timer');
let S = null, timerId = null, selTest = 'eq';

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const mathify = el => { const go=()=>{ if(window.MathJax&&MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(()=>{}); else setTimeout(go,150);}; go(); };
const fmt = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const num = s => parseFloat(String(s).trim().replace(',','.').replace(/[−–—]/g,'-').replace(/\s/g,''));

function drawGraph(el,g){
  if(!el||el.dataset.done) return; el.dataset.done='1';
  const W=720,H=360,cv=document.createElement('canvas'); cv.width=W; cv.height=H; el.appendChild(cv);
  const cs=getComputedStyle(document.documentElement), col=n=>cs.getPropertyValue(n).trim()||'#888';
  const x0=-0.3,x1=3.5,y0=-3,y1=3, X=x=>(x-x0)/(x1-x0)*W, Y=y=>H-(y-y0)/(y1-y0)*H, c=cv.getContext('2d');
  c.font='14px Arial';c.lineWidth=1;c.strokeStyle=col('--line');c.fillStyle=col('--muted');
  for(let y=-3;y<=3;y++){c.beginPath();c.moveTo(0,Y(y));c.lineTo(W,Y(y));c.stroke();if(y)c.fillText(y,X(0)+4,Y(y)-3);}
  for(let x=1;x<=3;x++){c.beginPath();c.moveTo(X(x),0);c.lineTo(X(x),H);c.stroke();c.fillText(x,X(x)+3,Y(0)+15);}
  c.strokeStyle=col('--fg');c.beginPath();c.moveTo(0,Y(0));c.lineTo(W,Y(0));c.moveTo(X(0),0);c.lineTo(X(0),H);c.stroke();
  c.fillText('π',X(Math.PI)-4,Y(0)+30);c.fillText('3π/4',X(3*Math.PI/4)-14,Y(0)+30);
  const seg=(f,color,a,b)=>{c.strokeStyle=color;c.lineWidth=2.5;c.beginPath();let pen=false;for(let x=a;x<=b;x+=0.002){const y=f(x);if(Math.abs(y)>3||Math.abs(x-Math.PI/2)<0.004){pen=false;continue;}pen?c.lineTo(X(x),Y(y)):c.moveTo(X(x),Y(y));pen=true;}c.stroke();};
  seg(Math.tan,col('--accent'),0,Math.PI);
  seg(()=>1/7,col('--ok'),0,Math.PI); seg(()=>-1,col('--no'),0,Math.PI);
  c.fillStyle=col('--no');[[Math.atan(1/7),1/7],[3*Math.PI/4,-1]].forEach(p=>{c.beginPath();c.arc(X(p[0]),Y(p[1]),6,0,7);c.fill();});
  c.fillStyle=col('--accent');c.fillText('y = tg x',X(1.2),Y(2.6));c.fillStyle=col('--ok');c.fillText('y = 1/7',X(2.4),Y(0.1)-4);c.fillStyle=col('--no');c.fillText('y = −1',X(2.4),Y(-1)+16);
  const a=document.createElement('a');a.href='https://www.desmos.com/calculator';a.target='_blank';a.rel='noopener';a.textContent='Открыть в Desmos и построить y = tg x, y = 1/7, y = −1';el.appendChild(a);
}
function note(t){const f=document.getElementById('fb');if(f)f.innerHTML='<div class="msg">'+t+'</div>';}
function setHTML(h){ app.innerHTML=h; mathify(app); }

/* ---------- старт ---------- */
function showStart(){
  clearInterval(timerId); timerEl.classList.add('hidden'); S=null;
  let hist=''; try{ const h=JSON.parse(localStorage.getItem('trigHist')||'[]'); if(h.length) hist='<div class="card"><h2>Последние результаты</h2><div class="tablewrap"><table>'+h.slice(-5).reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.title)}</td><td>${esc(x.name||'')}</td><td><b>${x.score} / ${x.total}</b></td></tr>`).join('')+'</table></div></div>'; }catch(e){}
  setHTML(`<div class="card"><h1>Тесты по тригонометрии</h1>
    <p class="muted">Подготовка учащихся 10–11 классов к ЦЭ/ЦТ. Вопросы и варианты ответов перемешиваются, на тест даётся 45 минут, после ответа сразу показывается решение.</p>
    <div class="tests">${Object.entries(TESTS).map(([k,t])=>`<div class="test-item ${k===selTest?'sel':''}" data-k="${k}"><b>${t.title}</b><span class="muted">${t.desc}</span></div>`).join('')}</div>
    <label class="row">Ваше имя (необязательно)</label><input type="text" id="nm" maxlength="40">
    <label class="row">Количество вопросов: <b id="cnt">10</b></label><input type="range" id="rng" min="3" max="10" value="10">
    <div class="actions"><button id="go">Начать тест</button></div></div>${hist}`);
  app.querySelectorAll('.test-item').forEach(e=>e.onclick=()=>{selTest=e.dataset.k;showStart();});
  document.getElementById('rng').oninput=e=>document.getElementById('cnt').textContent=e.target.value;
  document.getElementById('go').onclick=()=>start(selTest,+document.getElementById('rng').value,document.getElementById('nm').value.trim());
}

function start(key,count,name){
  const T=TESTS[key];
  const qs=shuffle(T.qs).slice(0,count).map(q=>{
    const o={...q};
    if(q.opts){ const ca=Array.isArray(q.a)?q.a:[q.a]; o.opts=shuffle(q.opts.map((t,k)=>({t,ok:ca.includes(k)}))); }
    return o;
  });
  S={key,title:T.title,name,qs,i:0,answered:false,res:qs.map(()=>({done:false,ok:false,given:''})),end:Date.now()+TIME_LIMIT*1000};
  timerEl.classList.remove('hidden');
  tick(); timerId=setInterval(tick,500);
  renderQ();
}

function tick(){
  const left=Math.max(0,Math.round((S.end-Date.now())/1000));
  timerEl.textContent='⏱ '+fmt(left);
  if(left<=0){clearInterval(timerId);finish(true);}
}

/* ---------- вопрос ---------- */
function renderQ(){
  const q=S.qs[S.i], n=S.qs.length;
  S.answered=false;
  let body='';
  if(q.t==='num') body=`<input type="text" id="ans" inputmode="decimal" autocomplete="off" placeholder="Введите ответ (число)">`;
  else body=q.opts.map((o,k)=>`<label class="opt"><input type="${q.t==='one'?'radio':'checkbox'}" name="o" value="${k}"><span>${o.t}</span></label>`).join('');
  const hint=q.t==='num'?'Введите число':q.t==='one'?'Выберите один вариант ответа':'Выберите все верные утверждения';
  setHTML(`<div class="prog"><div style="width:${S.i/n*100}%"></div></div>
   <div class="card" oncopy="return false" oncontextmenu="return false">
    <div class="qhead"><span>Вопрос ${S.i+1} из ${n}</span><span>${hint}</span></div>
    <div class="qtext">${q.q}</div>
    <div id="body">${body}</div>
    <div id="fb"></div>
    <div class="actions"><button id="ok">Ответить</button><button class="sec" id="fin">Завершить тест</button></div>
   </div>`);
  document.getElementById('ok').onclick=submit;
  let armed=false;document.getElementById('fin').onclick=function(){ if(!armed){armed=true;this.textContent='Точно завершить? Нажмите ещё раз';return;} clearInterval(timerId);finish(false); };
  const a=document.getElementById('ans'); if(a){a.focus();a.onkeydown=e=>{if(e.key==='Enter')submit();};}
}

function submit(){
  if(S.answered) return;
  const q=S.qs[S.i]; let ok=false, given='', correctTxt='';
  if(q.t==='num'){
    const raw=document.getElementById('ans').value;
    if(!raw.trim()){note('Введите ответ.');return;}
    const v=num(raw); given=raw.trim(); ok=!isNaN(v)&&Math.abs(v-q.a)<1e-9;
    correctTxt=String(q.a).replace('.',',');
  } else {
    const chosen=[...app.querySelectorAll('input[name=o]:checked')].map(e=>+e.value);
    if(!chosen.length){note('Выберите ответ.');return;}
    ok=q.opts.every((o,k)=>o.ok===chosen.includes(k));
    given=chosen.map(k=>q.opts[k].t).join('; ');
    correctTxt=q.opts.filter(o=>o.ok).map(o=>o.t).join('; ');
    app.querySelectorAll('.opt').forEach((l,k)=>{
      l.classList.add('locked');
      const inp=l.querySelector('input'); inp.disabled=true;
      if(q.opts[k].ok) l.classList.add('ok'); else if(chosen.includes(k)) l.classList.add('bad');
    });
  }
  S.answered=true;
  S.res[S.i]={done:true,ok,given,correct:correctTxt};
  if(q.t==='num') document.getElementById('ans').disabled=true;
  const last=S.i===S.qs.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'<b>Верно!</b>':'<b>Неверно.</b> Правильный ответ: '+(q.t==='num'?esc(correctTxt):correctTxt)}</div><div class="sol"><b>Решение.</b><br>${q.sol}</div>${q.graph?'<div class="plot" id="dg"></div>':''}`;
  mathify(document.getElementById('fb'));
  if(q.graph) drawGraph(document.getElementById('dg'),q.graph);
  const btn=document.getElementById('ok');
  btn.textContent=last?'Показать результат':'Следующий вопрос';
  btn.onclick=()=>{ if(last){clearInterval(timerId);finish(false);} else {S.i++;renderQ();} };
}

/* ---------- результат ---------- */
function finish(timeout){
  const total=S.qs.length, score=S.res.filter(r=>r.ok).length, pct=Math.round(score/total*100);
  timerEl.classList.add('hidden');
  try{ const h=JSON.parse(localStorage.getItem('trigHist')||'[]'); h.push({date:new Date().toLocaleString('ru-RU'),title:S.title,name:S.name,score,total}); localStorage.setItem('trigHist',JSON.stringify(h.slice(-30))); }catch(e){}
  const rows=S.qs.map((q,k)=>{const r=S.res[k]; const ans=q.t==='num'?String(q.a).replace('.',','):q.opts.filter(o=>o.ok).map(o=>o.t).join('; ');
    return `<details><summary><span class="${r.ok?'yes':'no'}">${r.ok?'✓':'✗'}</span> Вопрос ${k+1}${r.done?'':' (нет ответа)'}</summary>
      <div class="qtext" style="margin-top:10px">${q.q}</div>
      ${r.done?`<p>Ваш ответ: ${q.t==='num'?esc(r.given):r.given}</p>`:''}
      <p>Правильный ответ: ${q.t==='num'?esc(ans):ans}</p><div class="sol">${q.sol}</div>${q.graph?'<div class="plot" data-gi="'+k+'"></div>':''}</details>`;}).join('');
  setHTML(`<div class="card"><h2>${esc(S.title)}</h2>
    ${timeout?'<p class="no">Время вышло.</p>':''}
    ${S.name?`<p class="muted">Участник: ${esc(S.name)}</p>`:''}
    <div class="score">${score} из ${total} баллов (${pct}%)</div>
    <div class="prog"><div style="width:${pct}%"></div></div>
    <div class="actions"><button id="again">Пройти заново</button><button class="sec" id="home">К выбору теста</button></div></div>
    <div class="card"><h2>Разбор заданий</h2>${rows}</div>`);
  app.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{ const e=d.querySelector('.plot'); if(d.open&&e) drawGraph(e,S.qs[+e.dataset.gi].graph); }));
  document.getElementById('again').onclick=()=>start(S.key,S.qs.length,S.name);
  document.getElementById('home').onclick=showStart;
}

window.addEventListener('popstate',()=>{ if(S) history.pushState(null,'',location.href); });
document.addEventListener('copy',e=>{ if(S && !document.querySelector('.sol')?.contains(e.target)) e.preventDefault(); });

  nav.innerHTML='<h4>Главная</h4><a href="#home" data-h="home">О сайте</a><h4>Теория</h4>'

   +'<h4>Методика</h4>'+THEORY.filter(t=>t.num[0]==='2').map(t=>`<a href="#${t.id}" data-h="${t.id}"><b>${t.num}</b><span>${t.title}</span></a>`).join('')
   +'<h4>Проверка знаний</h4><a href="#tests" data-h="tests"><b>✎</b><span>Тесты</span></a>';
  mathify(nav);
}
function showHome(){
  setHTML(`<div class="card"><h1>Подготовка к ЦЭ/ЦТ по тригонометрии</h1>
   <p class="muted">Теоретический материал для 10–11 классов, разбор типичных ошибок и два теста с таймером и решениями.</p>
   <div class="grid2">${THEORY.map(t=>`<a href="#${t.id}"><span>${t.num}</span>${t.title}</a>`).join('')}<a href="#tests"><span>Тесты</span>Тригонометрические уравнения и преобразование выражений</a></div></div>`);
}
function showTheory(i){
  const t=THEORY[i], p=THEORY[i-1], n=THEORY[i+1];
  setHTML(`<article class="card theory"><div class="muted">Раздел ${t.num}</div><h2>${t.title}</h2>${t.html()}
   <div class="pager">${p?`<a href="#${p.id}">← ${p.num}</a>`:'<span></span>'}${n?`<a href="#${n.id}">${n.num} →</a>`:'<a href="#tests">К тестам →</a>'}</div></article>`);
}
function route(){
  const h=location.hash.slice(1)||'home';
  clearInterval(timerId); timerEl.classList.add('hidden'); S=null;
  const i=THEORY.findIndex(t=>t.id===h);
  if(h==='tests') showStart(); else if(i>=0) showTheory(i); else showHome();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('cur',a.dataset.h===(i>=0||h==='tests'?h:'home')));
  document.getElementById('nav').classList.remove('open'); document.getElementById('menuBtn').setAttribute('aria-expanded','false');
  window.scrollTo(0,0);
}
document.getElementById('menuBtn').onclick=function(){ const o=document.getElementById('nav').classList.toggle('open'); this.setAttribute('aria-expanded',o); };
window.addEventListener('hashchange',route);
window.addEventListener('load',()=>{buildNav();route();});
</script>

</body>
</html>
